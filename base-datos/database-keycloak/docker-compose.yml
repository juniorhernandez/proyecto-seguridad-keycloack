version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver-keycloak
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "kEycloak@rede$"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - keycloak-net

volumes:
  mssql_data:

networks:
  keycloak-net:
